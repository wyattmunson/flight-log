name: release-check

# Shows the version a PR would release and checks the release script's own tests.
on:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/lib/release.test.mjs
      - run: node scripts/release.mjs --check
      - name: Next version if merged
        run: node scripts/release.mjs --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
