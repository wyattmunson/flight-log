# Traefik routing for flights.wyattmunson.com (the bundled k3s Traefik).
# The app authenticates users itself (AUTH_REQUIRED=true: email + password, DB sessions), so there
# is no Traefik auth middleware; /api/health and /api/auth/login are the only unauthenticated routes.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flight-log-http
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`flights.wyattmunson.com`)
      middlewares:
        - name: redirect-https
      services:
        - name: web
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flight-log
spec:
  entryPoints: [websecure]
  routes:
    # /api is the longer rule, so Traefik matches it before the catch-all below.
    - kind: Rule
      match: Host(`flights.wyattmunson.com`) && PathPrefix(`/api`)
      services:
        - name: api
          port: 3000
    - kind: Rule
      match: Host(`flights.wyattmunson.com`)
      services:
        - name: web
          port: 80
  tls:
    certResolver: letsencrypt
