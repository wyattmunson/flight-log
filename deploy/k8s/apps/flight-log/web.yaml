apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app.kubernetes.io/name: flight-log, app.kubernetes.io/component: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: flight-log, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: flight-log, app.kubernetes.io/component: web }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: flight-log-web
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app.kubernetes.io/name: flight-log, app.kubernetes.io/component: web }
spec:
  selector: { app.kubernetes.io/name: flight-log, app.kubernetes.io/component: web }
  ports:
    - { name: http, port: 80, targetPort: http }
