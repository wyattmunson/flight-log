# k3s bundles Traefik and lets you override its Helm values with a HelmChartConfig.
# This enables Let's Encrypt (HTTP-01) with certificates persisted across restarts.
# Set the email before applying. While testing, uncomment the staging caServer line to avoid
# Let's Encrypt rate limits, then remove it (and delete /data/acme.json) for real certificates.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - --certificatesresolvers.letsencrypt.acme.email=munsonwf@gmail.com
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
    persistence:
      enabled: true
      path: /data
      size: 128Mi
    deployment:
      initContainers:
        # Pre-create acme.json with mode 0600 (Traefik refuses looser). Runs as the pod user (65532), so no chown.
        - name: volume-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - touch /data/acme.json && chmod 600 /data/acme.json
          volumeMounts:
            - name: data
              mountPath: /data
