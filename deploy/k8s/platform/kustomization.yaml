# Shared cluster infrastructure: Traefik TLS config and the shared Postgres cluster.
# Prerequisites: the CNPG operator (./cnpg-operator) and the DB credentials secret
# (deploy/scripts/create-secrets.sh) must already exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - traefik-config.yaml
  - postgres
